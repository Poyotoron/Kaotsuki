[package]
name = "kaotsuki-sender"
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
