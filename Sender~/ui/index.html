<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaotsuki Sender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sticky-area">
    <header>
      <div class="map-row">
        <label for="map-select">マップ</label>
        <select id="map-select"></select>
        <button id="map-refresh" type="button" title="一覧を更新">↻</button>
        <button id="map-open" type="button">ファイルを開く…</button>
      </div>
      <p id="map-info">マップを選んでください</p>
      <p id="receive-info"></p>
    </header>

    <section class="controls">
      <div class="action-buttons">
        <span class="switch-label" id="enabled-label">Kaotsuki</span>
        <button id="toggle-enabled" class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="enabled-label">
          <span class="switch-text">ON</span>
        </button>
        <span class="switch-label" id="lipsync-label">口パク</span>
        <button id="toggle-lipsync" class="switch" type="button" role="switch" aria-checked="false"
                aria-labelledby="lipsync-label" title="Kaotsuki が ON の間も口パクを動かします" disabled>
          <span class="switch-text">OFF</span>
        </button>
        <button id="btn-reset" type="button" disabled>リセット</button>
      </div>
      <div class="target">
        <span id="target-info">送信先 —</span>
        <button id="btn-settings" type="button" title="設定">⚙</button>
      </div>
    </section>

    <section class="expression-controls">
      <button id="btn-save-expression" type="button" disabled>表情を保存…</button>
      <button id="btn-save-clip" type="button" disabled>AnimationClip として保存…</button>
      <button id="btn-load-expression" type="button" disabled>表情を読み込む…</button>
    </section>

    <div id="message" role="alert" hidden></div>
    <input id="search" type="search" placeholder="ブレンドシェイプを検索" disabled>
  </div>

  <main id="slots"></main>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>設定</h2>
      <label for="set-host">送信先ホスト</label>
      <input id="set-host" type="text" required>
      <label for="set-port">ポート</label>
      <input id="set-port" type="number" min="1" max="65535" required>
      <label for="set-hold">保持時間（ミリ秒）</label>
      <input id="set-hold" type="number" min="100" max="1000" step="10" required>
      <label class="check"><input id="set-receive" type="checkbox"> VRChat から受信する（アバターに合わせてマップを切り換える）</label>
      <label for="set-receive-port">受信ポート</label>
      <input id="set-receive-port" type="number" min="1" max="65535" required>
      <p id="settings-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="settings-cancel" type="button">キャンセル</button>
        <button id="settings-save" class="primary" type="button">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="main.js"></script>
</body>
</html>
